<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0014;overflow:hidden;width:100vw;height:100vh;font-family:'Courier New',Courier,monospace;user-select:none}
canvas{display:block;position:absolute;inset:0}

/* Scanlines */
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}

/* UI layer */
#ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 14px}

/* Station selector */
#stations{display:flex;gap:5px;justify-content:center;padding:0 16px 10px;flex-wrap:wrap}
.stn-btn{
  background:rgba(0,0,0,0.45);border:1px solid rgba(185,103,255,0.3);
  color:rgba(185,103,255,0.6);font-family:'Courier New',monospace;font-size:8px;
  font-weight:bold;letter-spacing:0.14em;padding:4px 9px;border-radius:2px;
  cursor:pointer;transition:all 0.18s;text-transform:uppercase;white-space:nowrap;
}
.stn-btn:hover{border-color:rgba(185,103,255,0.7);color:#b967ff;background:rgba(185,103,255,0.1)}
.stn-btn.active{border-color:var(--col);color:var(--col);background:rgba(0,0,0,0.6);
  box-shadow:0 0 12px var(--col-dim)}

/* Now playing */
#now-playing{text-align:center;padding:0 16px 8px;min-height:28px}
#np-track{font-size:10px;color:rgba(255,255,255,0.8);letter-spacing:0.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np-artist{font-size:8.5px;color:rgba(185,103,255,0.6);letter-spacing:0.12em;margin-top:2px}

/* Main play button */
#controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px}
#playBtn{
  padding:8px 28px;background:rgba(185,103,255,0.1);border:1px solid rgba(185,103,255,0.45);
  color:#b967ff;font-family:'Courier New',monospace;font-size:10px;font-weight:bold;
  letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:all 0.2s;outline:none;flex:1;max-width:260px;
}
#playBtn:hover{background:rgba(185,103,255,0.25);border-color:#b967ff;box-shadow:0 0 20px rgba(185,103,255,0.3)}
#playBtn.on{border-color:var(--active-col);color:var(--active-col);background:rgba(0,0,0,0.5);
  box-shadow:0 0 18px var(--active-col-dim)}

#vol-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
#vol-lbl{font-size:7px;letter-spacing:0.18em;color:rgba(185,103,255,0.4)}
#vol{-webkit-appearance:none;appearance:none;width:52px;height:3px;background:rgba(185,103,255,0.25);
  border-radius:2px;outline:none;cursor:pointer}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;
  background:#b967ff;cursor:pointer;box-shadow:0 0 6px rgba(185,103,255,0.6)}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="scanlines"></div>
<div id="ui">
  <div id="stations"></div>
  <div id="now-playing">
    <div id="np-track">SELECT A STATION BELOW</div>
    <div id="np-artist"></div>
  </div>
  <div id="controls">
    <button id="playBtn">▶ &nbsp; TUNE IN</button>
    <div id="vol-wrap">
      <div id="vol-lbl">VOL</div>
      <input id="vol" type="range" min="0" max="100" value="75">
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=window.innerWidth;cv.height=window.innerHeight;
const W=cv.width,H=cv.height;

// ── Stations ─────────────────────────────────────────
const STATIONS=[
  {id:'digitalis',  name:'DIGITALIS',    genre:'SYNTHWAVE · CYBERPUNK', col:'#ff71ce',dim:'rgba(255,113,206,0.35)',
   streams:['https://ice1.somafm.com/digitalis-128-mp3','https://ice4.somafm.com/digitalis-128-mp3','https://ice6.somafm.com/digitalis-128-mp3']},
  {id:'groovesalad',name:'GROOVE SALAD', genre:'AMBIENT · ELECTRONICA', col:'#01cdfe',dim:'rgba(1,205,254,0.35)',
   streams:['https://ice4.somafm.com/groovesalad-128-mp3','https://ice2.somafm.com/groovesalad-128-mp3','https://ice6.somafm.com/groovesalad-128-mp3']},
  {id:'spacestation',name:'SPACE STN.',  genre:'SPACE AMBIENT',         col:'#b967ff',dim:'rgba(185,103,255,0.35)',
   streams:['https://ice1.somafm.com/spacestation-128-mp3','https://ice4.somafm.com/spacestation-128-mp3']},
  {id:'deepspaceone',name:'DEEP SPACE',  genre:'DARK AMBIENT · DRONE',  col:'#05ffa1',dim:'rgba(5,255,161,0.35)',
   streams:['https://ice1.somafm.com/deepspaceone-128-mp3','https://ice4.somafm.com/deepspaceone-128-mp3']},
];

let curStation=STATIONS[0], playing=false, audio=null;
let activeCol='#b967ff', activeColDim='rgba(185,103,255,0.3)';
let npTimer=null;

// ── Station buttons ───────────────────────────────────
const stnWrap=document.getElementById('stations');
STATIONS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='stn-btn'+(i===0?' active':'');
  b.style.setProperty('--col',s.col);
  b.style.setProperty('--col-dim',s.dim);
  b.textContent=s.name;
  b.addEventListener('click',()=>selectStation(s));
  stnWrap.appendChild(b);
});

function selectStation(s){
  if(curStation===s) return;
  curStation=s;
  document.querySelectorAll('.stn-btn').forEach((b,i)=>{
    b.classList.toggle('active',STATIONS[i]===s);
  });
  if(playing) startPlayback();
  else{
    document.getElementById('np-track').textContent=s.genre;
    document.getElementById('np-artist').textContent='';
  }
}

// ── Volume ────────────────────────────────────────────
const volSlider=document.getElementById('vol');
volSlider.addEventListener('input',()=>{ if(audio) audio.volume=volSlider.value/100; });

// ── Now Playing ───────────────────────────────────────
async function fetchNowPlaying(){
  try{
    const r=await fetch(`https://somafm.com/songs/${curStation.id}.json`,{cache:'no-store'});
    if(!r.ok) return;
    const d=await r.json();
    if(d.songs&&d.songs.length>0){
      const s=d.songs[0];
      const track=(s.title||'').trim();
      const artist=(s.artist||'').trim();
      if(track&&track!=='--'&&track!=='-'){
        document.getElementById('np-track').textContent=track.toUpperCase();
        document.getElementById('np-artist').textContent=artist?artist.toUpperCase():'';
        return;
      }
    }
  }catch{}
  document.getElementById('np-track').textContent=curStation.genre;
  document.getElementById('np-artist').textContent='SOMA FM · 24/7 STREAMING';
}

// ── Playback ──────────────────────────────────────────
const btn=document.getElementById('playBtn');

async function startPlayback(){
  if(audio){audio.pause();audio.src='';}
  btn.textContent='◌  CONNECTING...';
  btn.classList.remove('on');
  audio=new Audio();
  audio.volume=volSlider.value/100;
  let ok=false;
  for(const url of curStation.streams){
    try{audio.src=url;await audio.play();ok=true;break;}catch{}
  }
  if(ok){
    playing=true;
    activeCol=curStation.col; activeColDim=curStation.dim;
    document.documentElement.style.setProperty('--active-col',activeCol);
    document.documentElement.style.setProperty('--active-col-dim',activeColDim);
    btn.textContent=`◼  ${curStation.name} — CLICK TO STOP`;
    btn.classList.add('on');
    fetchNowPlaying();
    if(npTimer) clearInterval(npTimer);
    npTimer=setInterval(fetchNowPlaying,30000);
  }else{
    playing=false;
    btn.textContent='⚠  UNAVAILABLE — RETRY';
    document.getElementById('np-track').textContent='STREAM OFFLINE · TRY ANOTHER STATION';
    document.getElementById('np-artist').textContent='';
  }
}

btn.addEventListener('click',async()=>{
  if(playing){
    if(audio){audio.pause();audio.src='';}
    playing=false;
    if(npTimer){clearInterval(npTimer);npTimer=null;}
    btn.textContent='▶  TUNE IN';
    btn.classList.remove('on');
    document.getElementById('np-track').textContent=curStation.genre;
    document.getElementById('np-artist').textContent='';
  }else{
    await startPlayback();
  }
});

// ── Canvas scene ──────────────────────────────────────
const STARS=Array.from({length:100},()=>({
  x:Math.random()*W,y:Math.random()*H*0.48,
  r:Math.random()*1.2+0.2,a:Math.random()*0.55+0.15,
  spd:Math.random()*2+0.6,off:Math.random()*Math.PI*2
}));

const PARTS=Array.from({length:36},()=>mkPart());
function mkPart(){
  return{x:Math.random()*W,y:H*0.46+Math.random()*H*0.06,
    vx:(Math.random()-0.5)*0.35,vy:-(Math.random()*0.55+0.12),
    r:Math.random()*2+0.3,
    col:Math.random()<0.5?'255,113,206':'1,205,254',
    life:Math.random()*0.6+0.4,decay:0.0025+Math.random()*0.002};
}

function frame(ts){
  const t=ts*0.001;
  ctx.fillStyle='#0d0014';ctx.fillRect(0,0,W,H);

  // Stars
  STARS.forEach(s=>{
    const a=s.a*(0.5+0.5*Math.sin(t*s.spd+s.off));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
  });

  // Sun
  const sunX=W/2,sunY=H*0.47,sunR=Math.min(W,H)*0.19;
  const sg=ctx.createRadialGradient(sunX,sunY,sunR*0.2,sunX,sunY,sunR*2.8);
  sg.addColorStop(0,'rgba(255,113,206,0.24)');sg.addColorStop(0.5,'rgba(185,103,255,0.08)');sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg;ctx.fillRect(sunX-sunR*3,sunY-sunR*3,sunR*6,sunR*6);

  const sg2=ctx.createLinearGradient(sunX,sunY-sunR,sunX,sunY);
  sg2.addColorStop(0,'#ff71ce');sg2.addColorStop(0.5,'#ff58aa');sg2.addColorStop(1,'#b967ff');
  ctx.save();
  ctx.beginPath();ctx.arc(sunX,sunY,sunR,Math.PI,0,false);ctx.closePath();
  ctx.fillStyle=sg2;ctx.fill();
  ctx.fillStyle='#0d0014';
  for(let i=1;i<=10;i++){
    const p=i/11;const sy=sunY-sunR*(1-p)*(1-p);const th=sunR*0.03*(1+p*0.8);
    ctx.fillRect(sunX-sunR,sy-th/2,sunR*2,th);
  }
  ctx.restore();

  ctx.beginPath();ctx.strokeStyle='rgba(255,113,206,0.5)';ctx.lineWidth=1.2;
  ctx.moveTo(0,sunY);ctx.lineTo(W,sunY);ctx.stroke();

  // Grid
  const vp={x:W/2,y:sunY};
  const gfill=ctx.createLinearGradient(0,sunY,0,H);
  gfill.addColorStop(0,'rgba(20,0,40,0)');gfill.addColorStop(0.4,'rgba(30,0,60,0.3)');gfill.addColorStop(1,'rgba(8,0,18,0.9)');
  ctx.fillStyle=gfill;ctx.fillRect(0,sunY,W,H-sunY);

  const nv=20;ctx.lineWidth=0.7;
  for(let i=0;i<=nv;i++){
    const fx=i/nv;const bx=fx*W;const nx=vp.x+(bx-vp.x)*0.016;
    const a=0.16+0.24*Math.abs(fx-0.5)*2;
    ctx.strokeStyle=`rgba(185,103,255,${a})`;
    ctx.beginPath();ctx.moveTo(nx,sunY);ctx.lineTo(bx,H);ctx.stroke();
  }

  const scrollProg=(t*0.14)%1;const nh=18;
  for(let i=0;i<=nh;i++){
    const p=((i/nh)+scrollProg)%1;const y=sunY+(H-sunY)*p*p;
    const a=0.1+p*0.5;
    ctx.strokeStyle=`rgba(185,103,255,${a})`;ctx.lineWidth=0.55+p*0.45;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // Particles
  PARTS.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0){PARTS[i]=mkPart();return}
    ctx.globalAlpha=p.life*0.7;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgb(${p.col})`;ctx.fill();
    ctx.globalAlpha=1;
  });

  // Visualizer bars (react to active station color when playing)
  const bars=48;const bw=(W*0.72)/bars;const bx0=W*0.14;const byBase=H*0.56;const maxBH=H*0.14;
  const barCol = playing ? activeCol : '#ff71ce';
  const barCol2 = playing ? activeColDim.replace('rgba','rgb').replace(/,[\d.]+\)$/,')') : '#01cdfe';
  for(let i=0;i<bars;i++){
    const fi=i/bars;
    const spd = playing ? 1.8 : 1.0;
    const bh=maxBH*Math.max(0.03,
      0.36*Math.abs(Math.sin(t*spd+fi*7.5))+
      0.26*Math.abs(Math.sin(t*(spd*1.35)+fi*5.1+1.1))+
      0.22*Math.abs(Math.sin(t*(spd*0.55)+fi*11.3))+
      0.16*Math.abs(Math.sin(t*(spd*2.0)+fi*3.3+2.2))
    );
    const x=bx0+i*bw;
    const barG=ctx.createLinearGradient(x,byBase-bh,x,byBase);
    const tc=fi<0.5?`${barCol}dd`:`${barCol2}dd`;
    barG.addColorStop(0,tc);barG.addColorStop(0.65,'rgba(185,103,255,0.5)');barG.addColorStop(1,'rgba(185,103,255,0.05)');
    ctx.fillStyle=barG;
    ctx.shadowColor=fi<0.5?barCol:barCol2;ctx.shadowBlur=playing?10:5;
    ctx.fillRect(x+0.5,byBase-bh,bw-1.5,bh);
  }
  ctx.shadowBlur=0;

  // Title
  const fs=n=>Math.round(H*n);
  ctx.textAlign='center';
  ctx.font=`900 ${fs(0.072)}px 'Courier New',monospace`;
  ctx.fillStyle='rgba(255,113,206,0.9)';
  ctx.shadowColor='#ff71ce';ctx.shadowBlur=28;
  ctx.fillText('VAPOR FM',W/2,fs(0.1));ctx.shadowBlur=0;
  ctx.font=`${fs(0.022)}px 'Courier New',monospace`;
  ctx.fillStyle='rgba(1,205,254,0.55)';
  ctx.fillText('HERMES WAVE RADIO  ·  ヘルメス  ·  SYNTHWAVE',W/2,fs(0.138));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
