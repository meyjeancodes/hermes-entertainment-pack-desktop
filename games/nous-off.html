<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
/* Blob URLs have an opaque origin, so a relative <img> cannot resolve here.
   Paint the standby screen with a gradient + label instead — no asset needed. */
#off{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 42%, #1b2126 0%, #0b0e11 55%, #000 100%)}
#off .mark{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.55em;
  text-transform:uppercase;color:rgba(140,180,206,0.34);text-indent:0.55em}
#off .sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;letter-spacing:0.3em;
  text-transform:uppercase;color:rgba(255,255,255,0.16);text-indent:0.3em}
#off .dot{width:5px;height:5px;border-radius:50%;background:rgba(140,180,206,0.28);
  box-shadow:0 0 10px rgba(140,180,206,0.22)}
</style></head><body>
<div id="off"><div class="dot"></div><div class="mark">Standby</div><div class="sub">Hermes · Entertainment</div></div>
</body></html>
