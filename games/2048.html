<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
const N=4;
const BOARD=Math.min(W,H)*0.86;
const GAP=Math.max(4,BOARD*0.018);
const TILE=(BOARD-GAP*(N+1))/N;
const OX=(W-BOARD)/2,OY=(H-BOARD)/2;

const COLORS={0:'#1b1b22',2:'#2b3b4e',4:'#2f4a63',8:'#38bdf8',16:'#22a7e0',
  32:'#4ade80',64:'#22c55e',128:'#a78bfa',256:'#8b5cf6',512:'#f472b6',
  1024:'#ec4899',2048:'#fbbf24'};

let grid,score,best=0,state='run';

function reset(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;state='run';add();add();}
function add(){
  const free=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])free.push([r,c]);
  if(!free.length)return;
  const [r,c]=free[(Math.random()*free.length)|0];
  grid[r][c]=Math.random()<0.9?2:4;
}
function slide(row){
  const v=row.filter(x=>x);
  for(let i=0;i<v.length-1;i++){
    if(v[i]===v[i+1]){v[i]*=2;score+=v[i];v.splice(i+1,1);}
  }
  while(v.length<N)v.push(0);
  return v;
}
function rotate(g){ // clockwise
  const out=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)out[c][N-1-r]=g[r][c];
  return out;
}
function move(dir){ // 0 left,1 up,2 right,3 down
  const before=JSON.stringify(grid);
  let g=grid;
  for(let i=0;i<dir;i++)g=rotate(g);
  g=g.map(slide);
  for(let i=dir;i<4;i++)g=rotate(g);
  grid=g;
  if(JSON.stringify(grid)!==before){add();}
  if(!canMove()){best=Math.max(best,score);state='over';}
}
function canMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c])return true;
    if(c<N-1&&grid[r][c]===grid[r][c+1])return true;
    if(r<N-1&&grid[r][c]===grid[r+1][c])return true;
  }
  return false;
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.04)';
  rr(OX,OY,BOARD,BOARD,GAP);ctx.fill();

  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c];
    const x=OX+GAP+c*(TILE+GAP),y=OY+GAP+r*(TILE+GAP);
    ctx.fillStyle=COLORS[v]||'#fbbf24';
    if(v){ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;}else ctx.shadowBlur=0;
    rr(x,y,TILE,TILE,GAP*0.8);ctx.fill();ctx.shadowBlur=0;
    if(v){
      ctx.fillStyle=v<=4?'rgba(255,255,255,0.85)':'#04101a';
      const fs=TILE*(v>=1024?0.3:v>=128?0.36:0.44);
      ctx.font='700 '+fs+'px ui-monospace,monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x+TILE/2,y+TILE/2);
    }
  }
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font='600 '+Math.max(11,BOARD*0.035)+'px ui-monospace,monospace';
  ctx.textAlign='left';ctx.fillText('SCORE '+score,OX,OY-8);
  ctx.textAlign='right';ctx.fillText('BEST '+best,OX+BOARD,OY-8);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fbbf24';
    ctx.font='700 '+Math.max(18,BOARD*0.07)+'px ui-monospace,monospace';
    ctx.fillText('GAME OVER',W/2,H/2-4);
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='500 '+Math.max(11,BOARD*0.04)+'px ui-monospace,monospace';
    ctx.fillText('press SPACE to restart',W/2,H/2+Math.max(20,BOARD*0.06));
  }
}
addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(k===' '){reset();draw();return;}
  if(state!=='run')return;
  const m={ArrowLeft:0,a:0,ArrowUp:1,w:1,ArrowRight:2,d:2,ArrowDown:3,s:3}[k];
  if(m!==undefined){move(m);draw();}
});
reset();draw();
</script></body></html>
